[package]
name = "claude-paste-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "xclip stand-in and image preview window for the paste-preview Claude Code plugin"

[dependencies]
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["image", "randr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
